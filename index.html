<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupa x Partner Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --coupa-blue: #0050D1; }
        body { font-family: 'Poppins', sans-serif; font-weight: 300; background: #fdfdfe; color: #1e293b; }
        .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.4); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        label { font-size: 0.7rem; font-weight: 500; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.25rem; display: block; }
        input, select, textarea { font-size: 0.85rem !important; padding: 0.8rem 1rem !important; border-radius: 0.85rem !important; border: 1px solid #e2e8f0 !important; background: #ffffff !important; width: 100%; box-sizing: border-box; }
        .nav-btn { transition: all 0.3s ease; color: #64748b; font-weight: 400; cursor: pointer; border: none; background: transparent; }
        .nav-active { background: var(--coupa-blue) !important; color: white !important; box-shadow: 0 10px 20px -5px rgba(0,80,209,0.3); }
        th { font-size: 0.65rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; padding: 1rem; border-bottom: 2px solid #f8fafc; cursor: pointer; }
        th:hover { color: var(--coupa-blue); }
        td { font-size: 0.8rem; padding: 1rem; border-bottom: 1px solid #f8fafc; }
        .save-btn { background: #0050D1; color: white; border: none; border-radius: 1rem; padding: 0.85rem 1.5rem; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; width: 100%; }
        #toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 1rem; font-size: 0.8rem; font-weight: 500; z-index: 9999; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-6 md:p-14">

<div id="toast"></div>

<div class="max-w-[1500px] mx-auto">
    <header class="mb-14">
        <h1 class="text-5xl font-semibold text-[#0050D1] tracking-tight">Coupa <span class="font-light text-slate-400">x Partner Page</span></h1>
    </header>

    <nav class="glass rounded-full p-1.5 flex gap-1 mb-14 w-fit border border-slate-100">
        <button data-tab="insights" class="nav-btn nav-active px-7 py-2.5 rounded-full text-xs uppercase tracking-wider">Global Insights</button>
        <button data-tab="plans" class="nav-btn px-7 py-2.5 rounded-full text-xs uppercase tracking-wider">Workshop Plans</button>
        <button data-tab="scoops" class="nav-btn px-7 py-2.5 rounded-full text-xs uppercase tracking-wider">Scoops</button>
        <button data-tab="newsletters" class="nav-btn px-7 py-2.5 rounded-full text-xs uppercase tracking-wider">Newsletters</button>
        <button data-tab="revenue" class="nav-btn px-7 py-2.5 rounded-full text-xs uppercase tracking-wider">Training Revenue</button>
    </nav>

    <div id="insights" class="tab-content active space-y-10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="glass p-8 rounded-[2.5rem] min-h-[350px]">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">Workshop Ownership</h3>
                <div class="h-64"><canvas id="plansChart"></canvas></div>
            </div>
            <div class="glass p-8 rounded-[2.5rem] flex flex-col justify-center items-center text-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Total Revenue</h3>
                <h2 id="revTotal" class="text-7xl font-light text-[#0050D1] tracking-tighter">$0</h2>
            </div>
        </div>
    </div>

    <div id="plans" class="tab-content space-y-8">
        <div class="glass p-6 rounded-3xl flex gap-4 items-center">
            <span class="text-xs font-bold text-slate-400 uppercase">Filters:</span>
            <select id="filter_region" onchange="applyFilters()" class="!w-40"><option value="">All Regions</option><option>SEA</option><option>ANZ</option><option>Japan</option></select>
            <select id="filter_quarter" onchange="applyFilters()" class="!w-40"><option value="">All Quarters</option><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select>
        </div>

        <div class="glass p-10 rounded-[2.5rem]">
            <h2 class="text-2xl font-light mb-8">Register Plan</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="p_name" placeholder="Workshop name">
                <input type="date" id="p_date">
                <select id="p_region"><option>SEA</option><option>ANZ</option><option>Japan</option></select>
                <select id="p_quarter"><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select>
                <input type="text" id="p_owner" placeholder="Owner Name">
                <button class="save-btn" onclick="insertPlan()">Save Plan</button>
            </div>
        </div>
        <div class="glass rounded-[2.5rem] overflow-hidden">
            <table class="w-full text-left">
                <thead>
                    <tr>
                        <th onclick="sortTable('workshop_name')">Workshop ↕</th>
                        <th onclick="sortTable('date')">Date ↕</th>
                        <th>Region</th>
                        <th>Owner</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="plansTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="scoops" class="tab-content space-y-8">
        <div class="glass p-10 rounded-[2.5rem]">
            <h2 class="text-2xl font-light mb-8">Add Scoop</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="s_title" placeholder="Scoop Title">
                <select id="s_status"><option>Scheduled</option><option>Sent</option></select>
                <button class="save-btn" onclick="insertGeneric('scoops', {title: s_title.value, status: s_status.value})">Add Scoop</button>
            </div>
        </div>
        <div class="glass rounded-[2.5rem] overflow-hidden"><table class="w-full text-left"><thead><tr><th>Title</th><th>Status</th><th>Action</th></tr></thead><tbody id="scoopsTableBody"></tbody></table></div>
    </div>

    <div id="newsletters" class="tab-content space-y-8">
        <div class="glass p-10 rounded-[2.5rem]">
            <h2 class="text-2xl font-light mb-8">Add Newsletter</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="n_month" placeholder="e.g. May 2026">
                <input type="text" id="n_content" placeholder="Focus">
                <button class="save-btn" onclick="insertGeneric('newsletters', {month: n_month.value, content: n_content.value})">Add Newsletter</button>
            </div>
        </div>
        <div class="glass rounded-[2.5rem] overflow-hidden"><table class="w-full text-left"><thead><tr><th>Month</th><th>Focus</th><th>Action</th></tr></thead><tbody id="newslettersTableBody"></tbody></table></div>
    </div>

    <div id="revenue" class="tab-content space-y-8">
        <div class="glass p-10 rounded-[2.5rem]">
            <h2 class="text-2xl font-light mb-8">Log Revenue</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="r_partner" placeholder="Partner Name">
                <input type="number" id="r_amount" placeholder="Amount">
                <button class="save-btn" onclick="insertGeneric('training_revenue', {partner_name: r_partner.value, amount: parseFloat(r_amount.value)})">Log Revenue</button>
            </div>
        </div>
        <div class="glass rounded-[2.5rem] overflow-hidden"><table class="w-full text-left"><thead><tr><th>Partner</th><th>Amount</th><th>Action</th></tr></thead><tbody id="revenueTableBody"></tbody></table></div>
    </div>
</div>

<script>
    const SB_URL = 'https://lsdlwlcrkgcaiiljimhx.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZGx3bGNya2djYWlpbGppbWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NDIwNDAsImV4cCI6MjA5MzIxODA0MH0.MpYbXiZvZrVI6ptmkRMuPUT_JLGHlf0fANIDxO4ttc8';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    
    let cache = { plans: [], scoops: [], newsletters: [], revenue: [] };
    let currentSort = { col: 'date', asc: true };

    document.addEventListener('DOMContentLoaded', () => {
        setupTabs();
        fetchAllData();
    });

    function setupTabs() {
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('nav-active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });
    }

    async function fetchAllData() {
        const p = await _supabase.from('workshop_plans').select('*');
        const s = await _supabase.from('scoops').select('*');
        const n = await _supabase.from('newsletters').select('*');
        const r = await _supabase.from('training_revenue').select('*');

        cache.plans = p.data || [];
        cache.scoops = s.data || [];
        cache.newsletters = n.data || [];
        cache.revenue = r.data || [];

        applyFilters();
        renderOtherTables();
        updateInsights();
    }

    function applyFilters() {
        let filtered = [...cache.plans];
        const reg = document.getElementById('filter_region').value;
        const qtr = document.getElementById('filter_quarter').value;

        if(reg) filtered = filtered.filter(x => x.region === reg);
        if(qtr) filtered = filtered.filter(x => x.quarter === qtr);

        filtered.sort((a, b) => {
            let v1 = a[currentSort.col], v2 = b[currentSort.col];
            return currentSort.asc ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
        });

        renderPlans(filtered);
    }

    function sortTable(col) {
        currentSort.asc = (currentSort.col === col) ? !currentSort.asc : true;
        currentSort.col = col;
        applyFilters();
    }

    function renderPlans(data) {
        document.getElementById('plansTableBody').innerHTML = data.map(row => `
            <tr><td>${row.workshop_name}</td><td>${row.date}</td><td>${row.region}</td><td>${row.owner}</td>
            <td><button onclick="deleteRow('workshop_plans', ${row.id})" class="text-red-500">Delete</button></td></tr>
        `).join('');
    }

    function renderOtherTables() {
        document.getElementById('scoopsTableBody').innerHTML = cache.scoops.map(row => `<tr><td>${row.title}</td><td>${row.status}</td><td><button onclick="deleteRow('scoops', ${row.id})" class="text-red-500">Delete</button></td></tr>`).join('');
        document.getElementById('newslettersTableBody').innerHTML = cache.newsletters.map(row => `<tr><td>${row.month}</td><td>${row.content}</td><td><button onclick="deleteRow('newsletters', ${row.id})" class="text-red-500">Delete</button></td></tr>`).join('');
        document.getElementById('revenueTableBody').innerHTML = cache.revenue.map(row => `<tr><td>${row.partner_name}</td><td>$${row.amount}</td><td><button onclick="deleteRow('training_revenue', ${row.id})" class="text-red-500">Delete</button></td></tr>`).join('');
    }

    async function insertPlan() {
        const payload = {
            workshop_name: document.getElementById('p_name').value,
            date: document.getElementById('p_date').value,
            region: document.getElementById('p_region').value,
            quarter: document.getElementById('p_quarter').value,
            owner: document.getElementById('p_owner').value
        };
        await _supabase.from('workshop_plans').insert([payload]);
        fetchAllData();
    }

    async function insertGeneric(table, obj) {
        await _supabase.from(table).insert([obj]);
        fetchAllData();
    }

    async function deleteRow(table, id) {
        await _supabase.from(table).delete().eq('id', id);
        fetchAllData();
    }

    function updateInsights() {
        const total = cache.revenue.reduce((sum, r) => sum + (r.amount || 0), 0);
        document.getElementById('revTotal').textContent = `$${total.toLocaleString()}`;
    }
</script>
</body>
</html>
