<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupa x Partner Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --coupa-blue: #0050D1; }
        body { font-family: 'Poppins', sans-serif; font-weight: 300; background: #fdfdfe; color: #1e293b; }
        .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.4); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        label { font-size: 0.7rem; font-weight: 500; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.25rem; display: block; }
        input, select, textarea { font-size: 0.85rem !important; padding: 0.8rem 1rem !important; border-radius: 0.85rem !important; border: 1px solid #e2e8f0 !important; background: #ffffff !important; width: 100%; box-sizing: border-box; }
        .nav-btn { transition: all 0.3s ease; color: #64748b; font-weight: 400; cursor: pointer; border: none; background: transparent; }
        .nav-active { background: var(--coupa-blue) !important; color: white !important; box-shadow: 0 10px 20px -5px rgba(0,80,209,0.3); }
        th { font-size: 0.65rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; padding: 1rem; border-bottom: 2px solid #f8fafc; }
        td { font-size: 0.8rem; padding: 1rem; border-bottom: 1px solid #f8fafc; }
        .save-btn { background: #0050D1; color: white; border: none; border-radius: 1rem; padding: 0.85rem 1.5rem; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; width: 100%; }
        .save-btn:hover { background: #0041b0; }
        .bulk-btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.55rem 1.1rem; border-radius: 0.75rem; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; border: none; transition: all 0.2s; }
        .upload-btn { background: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; }
        .download-btn { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .template-btn { background: #fafafa; color: #64748b; border: 1px solid #e2e8f0; }
        #toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 1rem; font-size: 0.8rem; font-weight: 500; z-index: 9999; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .progress-bar { height: 4px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-top: 0.5rem; display: none; }
        .progress-bar-fill { height: 100%; background: #0050D1; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body class="p-6 md:p-14">

<div id="toast"></div>

<div class="max-w-[1500px] mx-auto">
    <header class="mb-14">
        <h1 class="text-5xl font-semibold text-[#0050D1] tracking-tight">Coupa <span class="font-light text-slate-400">x Partner Page</span></h1>
        <p class="text-slate-400 text-lg font-light mt-2 italic">Partner on a page</p>
    </header>

    <nav class="glass rounded-full p-1.5 flex gap-1 mb-14 w-fit border border-slate-100">
        <button data-tab="insights" class="nav-btn nav-active px-7 py-2.5 rounded-full text-xs uppercase tracking-wider">Global Insights</button>
        <button data-tab="plans" class="nav-btn px-7 py-2.5 rounded-full text-xs uppercase tracking-wider">Workshop Plans</button>
        <button data-tab="scoops" class="nav-btn px-7 py-2.5 rounded-full text-xs uppercase tracking-wider">Scoops</button>
        <button data-tab="newsletters" class="nav-btn px-7 py-2.5 rounded-full text-xs uppercase tracking-wider">Newsletters</button>
        <button data-tab="revenue" class="nav-btn px-7 py-2.5 rounded-full text-xs uppercase tracking-wider">Training Revenue</button>
    </nav>

    <div id="insights" class="tab-content active space-y-10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="glass p-8 rounded-[2.5rem] min-h-[350px]">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">Workshop Ownership</h3>
                <div class="h-64"><canvas id="plansChart"></canvas></div>
            </div>
            <div class="glass p-8 rounded-[2.5rem] min-h-[350px]">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">Communication Status</h3>
                <div class="h-64"><canvas id="scoopsChart"></canvas></div>
            </div>
            <div class="glass p-8 rounded-[2.5rem] flex flex-col justify-center items-center text-center">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Total Partner Revenue</h3>
                <h2 id="revTotal" class="text-7xl font-light text-[#0050D1] tracking-tighter">$0</h2>
                <div class="w-full mt-8 h-32"><canvas id="revChart"></canvas></div>
            </div>
        </div>
    </div>

    <div id="plans" class="tab-content space-y-8">
        <div class="flex items-center gap-3 flex-wrap">
            <span class="text-xs text-slate-400 uppercase tracking-widest font-medium">Bulk Actions:</span>
            <button class="bulk-btn template-btn" onclick="downloadTemplate('plans')">⬇ Template</button>
            <label class="bulk-btn upload-btn" for="plansUpload">⬆ Upload CSV
                <input type="file" id="plansUpload" accept=".csv" onchange="handleBulkUpload('workshop_plans', this, plansColumns)">
            </label>
            <button class="bulk-btn download-btn" onclick="downloadData('workshop_plans', plansColumns, 'workshop_plans')">⬇ Export</button>
            <div id="plansProgress" class="progress-bar w-40"><div class="progress-bar-fill" id="plansProgressFill"></div></div>
        </div>

        <div class="glass p-10 rounded-[2.5rem]" id="planFormContainer">
            <h2 class="text-2xl font-light mb-8" id="formHeader">Register Workshop Plan</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="hidden" id="p_id">
                
                <div class="md:col-span-2"><label>Presales Workshop</label><input type="text" id="p_name" placeholder="Workshop name"></div>
                <div>
                    <div class="flex justify-between items-center">
                        <label>Date</label>
                        <label class="inline-flex items-center gap-1 cursor-pointer" style="text-transform: none; font-size: 0.65rem; color: #0050D1;">
                            <input type="checkbox" id="p_tbd" class="w-3 h-3" onchange="toggleTBD(this)"> TBD
                        </label>
                    </div>
                    <input type="date" id="p_date">
                </div>
                <div><label>Month</label><input type="text" id="p_month" readonly style="background:#f8fafc !important;"></div>
                <div><label>Region</label><select id="p_region"><option>SEA</option><option>ANZ</option><option>Japan</option><option>Other</option></select></div>
                <div><label>Quarter</label><select id="p_quarter"><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select></div>
                <div><label>Owner</label><select id="p_owner"><option>Murtaza</option><option>Namrata</option><option>Sukhada</option><option>Junko</option></select></div>
                <div><label>Instructor</label><input type="text" id="p_instructor" placeholder="Instructor name"></div>
                <div><label>Type</label><select id="p_type"><option>Free</option><option>Paid</option></select></div>
                <div class="md:col-span-2"><label>Comments</label><textarea id="p_comments" rows="1" placeholder="Add notes..."></textarea></div>
                <div class="md:col-span-1 flex items-end">
                    <button class="save-btn" id="saveBtn" onclick="insertPlan()">Save Plan</button>
                </div>
            </div>
        </div>

        <div class="glass rounded-[2.5rem] overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-slate-50/50">
                    <tr>
                        <th>Workshop</th>
                        <th>Date</th>
                        <th>Region</th>
                        <th>Owner</th>
                        <th>Instructor</th>
                        <th>Type</th>
                        <th>Comments</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="plansTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="scoops" class="tab-content">
        <div class="glass p-10 rounded-[2.5rem]"><h2 class="text-2xl font-light">Scoops Management</h2></div>
    </div>
    <div id="newsletters" class="tab-content">
         <div class="glass p-10 rounded-[2.5rem]"><h2 class="text-2xl font-light">Newsletters</h2></div>
    </div>
    <div id="revenue" class="tab-content">
         <div class="glass p-10 rounded-[2.5rem]"><h2 class="text-2xl font-light">Training Revenue</h2></div>
    </div>
</div>

<script>
    const SB_URL = 'https://lsdlwlcrkgcaiiljimhx.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZGx3bGNya2djYWlpbGppbWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NDIwNDAsImV4cCI6MjA5MzIxODA0MH0.MpYbXiZvZrVI6ptmkRMuPUT_JLGHlf0fANIDxO4ttc8';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    let charts = {};

    const plansColumns = ['workshop_name','date','month','region','quarter', 'owner', 'instructor', 'payment_type', 'comments'];

    document.addEventListener('DOMContentLoaded', () => {
        initTabs();
        initDateListener();
        refreshData();
    });

    function initTabs() {
        const buttons = document.querySelectorAll('.nav-btn');
        const contents = document.querySelectorAll('.tab-content');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.getAttribute('data-tab');
                buttons.forEach(b => b.classList.remove('nav-active'));
                contents.forEach(c => c.classList.remove('active'));
                btn.classList.add('nav-active');
                document.getElementById(target).classList.add('active');
            });
        });
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = `fixed bottom-8 right-8 p-4 rounded-xl text-white ${type === 'success' ? 'bg-emerald-500' : 'bg-red-500'}`;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function initDateListener() {
        const dateInput = document.getElementById('p_date');
        dateInput.addEventListener('change', (e) => {
            if(!e.target.value) return;
            const d = new Date(e.target.value);
            document.getElementById('p_month').value = d.toLocaleString('default', { month: 'long' });
        });
    }

    function toggleTBD(checkbox) {
        const dateInput = document.getElementById('p_date');
        const monthInput = document.getElementById('p_month');
        if (checkbox.checked) {
            dateInput.value = "";
            dateInput.disabled = true;
            dateInput.style.opacity = "0.5";
            monthInput.value = "To be Decided";
        } else {
            dateInput.disabled = false;
            dateInput.style.opacity = "1";
            monthInput.value = "";
        }
    }

    async function refreshData() {
        const { data, error } = await _supabase.from('workshop_plans').select('*').order('date', { ascending: false });
        if (error) return console.error(error);

        const tbody = document.getElementById('plansTableBody');
        tbody.innerHTML = data.map(row => `
            <tr>
                <td class="font-medium">${row.workshop_name}</td>
                <td>${row.date || '<span class="text-orange-500 font-medium">TBD</span>'}</td>
                <td>${row.region}</td>
                <td>${row.owner}</td>
                <td>${row.instructor || '-'}</td>
                <td><span class="px-2 py-1 rounded text-[10px] ${row.payment_type === 'Paid' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'}">${row.payment_type || 'Free'}</span></td>
                <td class="max-w-[150px] truncate italic text-slate-400" title="${row.comments || ''}">${row.comments || '-'}</td>
                <td class="flex gap-2">
                    <button onclick='startEdit(${JSON.stringify(row)})' class="text-blue-500 hover:text-blue-700">✏️</button>
                    <button onclick="deleteRow('workshop_plans', ${row.id})" class="text-red-400 hover:text-red-600">Delete</button>
                </td>
            </tr>
        `).join('');
        
        updateCharts(data);
    }

    function startEdit(row) {
        document.getElementById('formHeader').innerText = "Edit Workshop Plan";
        document.getElementById('saveBtn').innerText = "Update Plan";
        document.getElementById('saveBtn').onclick = () => updatePlan();
        
        document.getElementById('p_id').value = row.id;
        document.getElementById('p_name').value = row.workshop_name;
        document.getElementById('p_date').value = row.date || "";
        document.getElementById('p_region').value = row.region;
        document.getElementById('p_quarter').value = row.quarter;
        document.getElementById('p_owner').value = row.owner;
        document.getElementById('p_instructor').value = row.instructor || "";
        document.getElementById('p_type').value = row.payment_type || "Free";
        document.getElementById('p_comments').value = row.comments || "";
        
        const isTBD = !row.date;
        document.getElementById('p_tbd').checked = isTBD;
        toggleTBD(document.getElementById('p_tbd'));
        if(!isTBD) {
            const d = new Date(row.date);
            document.getElementById('p_month').value = d.toLocaleString('default', { month: 'long' });
        }

        document.getElementById('planFormContainer').scrollIntoView({ behavior: 'smooth' });
    }

    async function updatePlan() {
        const id = document.getElementById('p_id').value;
        const isTBD = document.getElementById('p_tbd').checked;
        const payload = {
            workshop_name: document.getElementById('p_name').value,
            date: isTBD ? null : document.getElementById('p_date').value,
            month: document.getElementById('p_month').value,
            region: document.getElementById('p_region').value,
            quarter: document.getElementById('p_quarter').value,
            owner: document.getElementById('p_owner').value,
            instructor: document.getElementById('p_instructor').value,
            payment_type: document.getElementById('p_type').value,
            comments: document.getElementById('p_comments').value
        };

        const { error } = await _supabase.from('workshop_plans').update(payload).eq('id', id);
        if (error) showToast(error.message, 'error');
        else {
            showToast('Plan updated successfully!');
            resetForm();
            refreshData();
        }
    }

    function resetForm() {
        document.getElementById('formHeader').innerText = "Register Workshop Plan";
        document.getElementById('saveBtn').innerText = "Save Plan";
        document.getElementById('saveBtn').onclick = () => insertPlan();
        document.getElementById('p_id').value = "";
        document.getElementById('p_name').value = "";
        document.getElementById('p_date').value = "";
        document.getElementById('p_date').disabled = false;
        document.getElementById('p_date').style.opacity = "1";
        document.getElementById('p_tbd').checked = false;
        document.getElementById('p_month').value = "";
        document.getElementById('p_comments').value = "";
        document.getElementById('p_instructor').value = "";
    }

    async function insertPlan() {
        const isTBD = document.getElementById('p_tbd').checked;
        const payload = {
            workshop_name: document.getElementById('p_name').value,
            date: isTBD ? null : document.getElementById('p_date').value,
            month: document.getElementById('p_month').value,
            region: document.getElementById('p_region').value,
            quarter: document.getElementById('p_quarter').value,
            owner: document.getElementById('p_owner').value,
            instructor: document.getElementById('p_instructor').value,
            payment_type: document.getElementById('p_type').value,
            comments: document.getElementById('p_comments').value
        };

        if(!payload.workshop_name) return showToast("Name is required", "error");

        const { error } = await _supabase.from('workshop_plans').insert([payload]);
        if (error) showToast(error.message, 'error');
        else {
            showToast('Plan saved successfully!');
            resetForm();
            refreshData();
        }
    }

    async function deleteRow(table, id) {
        if(!confirm('Delete this record?')) return;
        const { error } = await _supabase.from(table).delete().eq('id', id);
        if (error) showToast(error.message, 'error');
        else refreshData();
    }

    function updateCharts(data) {
        const counts = data.reduce((acc, curr) => {
            acc[curr.owner] = (acc[curr.owner] || 0) + 1;
            return acc;
        }, {});

        const ctx = document.getElementById('plansChart').getContext('2d');
        if (charts.plans) charts.plans.destroy();
        
        charts.plans = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(counts),
                datasets: [{
                    data: Object.values(counts),
                    backgroundColor: ['#0050D1', '#60a5fa', '#94a3b8', '#e2e8f0']
                }]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
        });
    }

    function downloadData(table, columns, filename) {
        showToast('Exporting ' + filename + '...');
    }
</script>
</body>
</html>
