<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupa x Partner Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --coupa-blue: #0050D1; }
        body { font-family: 'Poppins', sans-serif; font-weight: 300; background: #fdfdfe; color: #1e293b; }
        .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.4); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        label { font-size: 0.7rem; font-weight: 500; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.25rem; display: block; }
        input, select, textarea { font-size: 0.85rem !important; padding: 0.8rem 1rem !important; border-radius: 0.85rem !important; border: 1px solid #e2e8f0 !important; background: #ffffff !important; width: 100%; box-sizing: border-box; }
        .nav-btn { transition: all 0.3s ease; color: #64748b; font-weight: 400; cursor: pointer; border: none; background: transparent; }
        .nav-active { background: var(--coupa-blue) !important; color: white !important; box-shadow: 0 10px 20px -5px rgba(0,80,209,0.3); }
        th { font-size: 0.65rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; padding: 1rem; border-bottom: 2px solid #f8fafc; }
        td { font-size: 0.8rem; padding: 1rem; border-bottom: 1px solid #f8fafc; }
        .save-btn { background: #0050D1; color: white; border: none; border-radius: 1rem; padding: 0.85rem 1.5rem; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; width: 100%; transition: all 0.2s; }
        .save-btn.edit-mode { background: #f59e0b; } /* Amber color for edit mode */
        .bulk-btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.55rem 1.1rem; border-radius: 0.75rem; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; border: none; transition: all 0.2s; }
        .upload-btn { background: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; }
        #toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 1rem; font-size: 0.8rem; font-weight: 500; z-index: 9999; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-6 md:p-14">

<div id="toast"></div>

<div class="max-w-[1500px] mx-auto">
    <header class="mb-14">
        <h1 class="text-5xl font-semibold text-[#0050D1] tracking-tight">Coupa <span class="font-light text-slate-400">x Partner Page</span></h1>
    </header>

    <nav class="glass rounded-full p-1.5 flex gap-1 mb-14 w-fit border border-slate-100">
        <button data-tab="plans" class="nav-btn nav-active px-7 py-2.5 rounded-full text-xs uppercase tracking-wider">Workshop Plans</button>
    </nav>

    <div id="plans" class="tab-content active space-y-8">
        <div class="flex items-center gap-3 flex-wrap">
            <span class="text-xs text-slate-400 uppercase tracking-widest font-medium">Bulk Actions:</span>
            <label class="bulk-btn upload-btn" for="plansUpload">
                ⬆ Upload CSV
                <input type="file" id="plansUpload" accept=".csv" class="hidden" onchange="handleBulkUpload('workshop_plans', this, plansColumns)">
            </label>
            <div id="uploadStatus" class="text-xs text-slate-400"></div>
        </div>

        <div id="registrationForm" class="glass p-10 rounded-[2.5rem] transition-all duration-500">
            <div class="flex justify-between items-center mb-8">
                <h2 id="formTitle" class="text-2xl font-light">Register Workshop Plan</h2>
                <button id="cancelEdit" class="hidden text-xs text-red-500 uppercase tracking-widest font-bold" onclick="resetForm()">Cancel Edit</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="hidden" id="edit_id">
                <div class="md:col-span-2"><label>Presales Workshop</label><input type="text" id="p_name"></div>
                <div><label>Date (Optional if TBD)</label><input type="date" id="p_date"></div>
                <div><label>Region</label><select id="p_region"><option>SEA</option><option>ANZ</option><option>Japan</option></select></div>
                <div><label>Owner</label><select id="p_owner"><option>Murtaza</option><option>Namrata</option></select></div>
                <div><label>Instructor</label><input type="text" id="p_instructor"></div>
                <div><label>Type</label><select id="p_type"><option>Free</option><option>Paid</option></select></div>
                <div class="md:col-span-2"><label>Comments</label><textarea id="p_comments" rows="1"></textarea></div>
                <div class="flex items-end">
                    <button id="mainActionBtn" class="save-btn w-full" onclick="handleSave()">Save Plan</button>
                </div>
            </div>
        </div>

        <div class="glass rounded-[2.5rem] overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-slate-50/50">
                    <tr>
                        <th>Workshop</th><th>Date</th><th>Region</th><th>Owner</th><th>Instructor</th><th>Type</th><th>Comments</th><th>Action</th>
                    </tr>
                </thead>
                <tbody id="plansTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://lsdlwlcrkgcaiiljimhx.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzZGx3bGNya2djYWlpbGppbWh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NDIwNDAsImV4cCI6MjA5MzIxODA0MH0.MpYbXiZvZrVI6ptmkRMuPUT_JLGHlf0fANIDxO4ttc8';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    const plansColumns = ['workshop_name','date','month','region','quarter', 'owner', 'instructor', 'payment_type', 'comments'];

    document.addEventListener('DOMContentLoaded', () => refreshData());

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = `fixed bottom-8 right-8 p-4 rounded-xl text-white ${type === 'success' ? 'bg-emerald-500' : 'bg-red-500'}`;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 4000);
    }

    async function refreshData() {
        const { data, error } = await _supabase.from('workshop_plans').select('*').order('created_at', { ascending: false });
        if (error) return console.error(error);

        const tbody = document.getElementById('plansTableBody');
        tbody.innerHTML = data.map(row => `
            <tr>
                <td class="font-medium">${row.workshop_name}</td>
                <td>${row.date || '<span class="text-orange-500 font-bold">TBD</span>'}</td>
                <td>${row.region}</td>
                <td>${row.owner}</td>
                <td>${row.instructor || '-'}</td>
                <td>${row.payment_type || 'Free'}</td>
                <td class="max-w-[200px] truncate text-slate-400">${row.comments || '-'}</td>
                <td class="flex gap-4">
                    <button onclick="startEdit(${JSON.stringify(row).replace(/"/g, '&quot;')})" class="text-blue-500 hover:text-blue-700 transition-colors" title="Edit">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                        </svg>
                    </button>
                    <button onclick="deleteRow(${row.id})" class="text-red-400 hover:text-red-600 transition-colors" title="Delete">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function startEdit(row) {
        // Scroll to form
        document.getElementById('registrationForm').scrollIntoView({ behavior: 'smooth' });
        
        // Populate fields
        document.getElementById('edit_id').value = row.id;
        document.getElementById('p_name').value = row.workshop_name;
        document.getElementById('p_date').value = row.date || '';
        document.getElementById('p_region').value = row.region;
        document.getElementById('p_owner').value = row.owner;
        document.getElementById('p_instructor').value = row.instructor || '';
        document.getElementById('p_type').value = row.payment_type;
        document.getElementById('p_comments').value = row.comments || '';

        // UI Changes
        document.getElementById('formTitle').textContent = "Update Workshop Plan";
        document.getElementById('mainActionBtn').textContent = "Update Plan";
        document.getElementById('mainActionBtn').classList.add('edit-mode');
        document.getElementById('cancelEdit').classList.remove('hidden');
    }

    function resetForm() {
        document.getElementById('edit_id').value = "";
        document.getElementById('p_name').value = "";
        document.getElementById('p_date').value = "";
        document.getElementById('p_instructor').value = "";
        document.getElementById('p_comments').value = "";
        
        document.getElementById('formTitle').textContent = "Register Workshop Plan";
        document.getElementById('mainActionBtn').textContent = "Save Plan";
        document.getElementById('mainActionBtn').classList.remove('edit-mode');
        document.getElementById('cancelEdit').classList.add('hidden');
    }

    async function handleSave() {
        const id = document.getElementById('edit_id').value;
        const payload = {
            workshop_name: document.getElementById('p_name').value,
            date: document.getElementById('p_date').value || null,
            region: document.getElementById('p_region').value,
            owner: document.getElementById('p_owner').value,
            instructor: document.getElementById('p_instructor').value,
            payment_type: document.getElementById('p_type').value,
            comments: document.getElementById('p_comments').value
        };

        if (!payload.workshop_name) return showToast("Workshop name is required", "error");

        let result;
        if (id) {
            // Update existing
            result = await _supabase.from('workshop_plans').update(payload).eq('id', id);
        } else {
            // Insert new
            result = await _supabase.from('workshop_plans').insert([payload]);
        }

        if (result.error) {
            showToast(result.error.message, 'error');
        } else {
            showToast(id ? 'Updated Successfully!' : 'Saved Successfully!');
            resetForm();
            refreshData();
        }
    }

    async function deleteRow(id) {
        if(!confirm('Are you sure you want to delete this plan?')) return;
        const { error } = await _supabase.from('workshop_plans').delete().eq('id', id);
        if (error) showToast(error.message, 'error');
        else {
            showToast('Deleted successfully');
            refreshData();
        }
    }

    // ── BULK UPLOAD LOGIC remains same ──
    function parseCSV(text) {
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
        const result = [];
        for (let i = 1; i < lines.length; i++) {
            const row = [];
            let current = "";
            let inQuotes = false;
            for (let char of lines[i]) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { row.push(current.trim()); current = ""; }
                else { current += char; }
            }
            row.push(current.trim());
            result.push(row);
        }
        return result;
    }

    async function handleBulkUpload(tableName, input, columns) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const text = e.target.result;
                const rows = parseCSV(text);
                const payload = rows.map(row => {
                    let obj = {};
                    columns.forEach((col, i) => { obj[col] = row[i] || null; });
                    return obj;
                });
                const { error } = await _supabase.from(tableName).insert(payload);
                if (error) throw error;
                showToast(`Saved ${payload.length} rows.`);
                refreshData();
            } catch (err) {
                showToast("Error: " + err.message, "error");
            } finally { input.value = ""; }
        };
        reader.readAsText(file);
    }
</script>

</body>
</html>
